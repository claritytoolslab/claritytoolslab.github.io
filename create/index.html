<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MT48H98V3W"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MT48H98V3W');
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (typeof gtag === "function") {
      gtag('event', 'snap2plan_open_redirect_page', { value: '1' });
    }
  });

  window.addEventListener("load", function() {
    if (typeof gtag === "function") {
      gtag('event', 'snap2plan_redirect_fired', { value: '1' });
    }
  });

  // Deep link redirect logic
  (function() {
    // Get the full query string including ?data=...
    const queryString = window.location.search;

    // Build deep link URL
    const deepLink = 'snap2plan://create' + queryString;

    // Try to open the app
    window.location.href = deepLink;

    // Fallback to App Store after 2 seconds if app not installed
    setTimeout(function() {
      window.location.href = 'https://apps.apple.com/us/app/snap2plan/id6754525197';
    }, 2000);
  })();
</script>
    <title>Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }
    </style>
</head>
<body></body>
</html>
